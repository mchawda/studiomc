# Studiomc — Multi-platform Release Pipeline
#
# Trigger: push a version tag  →  git tag v1.0.0 && git push --tags
#
# Builds:
#   - macOS Apple Silicon  (.dmg)
#   - macOS Intel          (.dmg)
#   - Windows x64          (.exe installer)
#   - Linux x64            (.AppImage)
#
# Publishes all artifacts as GitHub Release assets.
# ══════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.9"
  PYTHON_VERSION: "3.12"

jobs:
  # ── macOS Apple Silicon ──────────────────────────────────────────────
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-14  # M1 runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # ── Import certificate BEFORE building ──
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Save keychain password for later steps
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # ── Configure Xcode for Developer ID signing ──
      - name: Configure Xcode signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PBXPROJ="studiomc_app/macos/Runner.xcodeproj/project.pbxproj"

          # Patch the Runner target Release config for Developer ID signing
          # Replace CODE_SIGN_IDENTITY = "-" with Developer ID Application
          sed -i '' 's/CODE_SIGN_IDENTITY = "-";/CODE_SIGN_IDENTITY = "Developer ID Application";/' "$PBXPROJ"

          # Replace CODE_SIGN_STYLE = Automatic with Manual (only in Release config section)
          # The Release config for Runner target (33CC10FD) needs Manual for Developer ID
          sed -i '' '/CODE_SIGN_ENTITLEMENTS = Runner\/Release.entitlements/,/name = Release/ {
            s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/
          }' "$PBXPROJ"

          # Add DEVELOPMENT_TEAM after COMBINE_HIDPI_IMAGES in the Release config
          sed -i '' "/CODE_SIGN_ENTITLEMENTS = Runner\/Release.entitlements/,/name = Release/ {
            /COMBINE_HIDPI_IMAGES = YES/a\\
            DEVELOPMENT_TEAM = $APPLE_TEAM_ID;
          }" "$PBXPROJ"

          # Verify changes
          echo "Checking pbxproj for Developer ID..."
          grep -A2 "Developer ID" "$PBXPROJ" || echo "Warning: Developer ID not found"
          grep "DEVELOPMENT_TEAM" "$PBXPROJ" || echo "Warning: DEVELOPMENT_TEAM not found"

      - name: Install Python dependencies
        env:
          CMAKE_ARGS: "-DGGML_METAL=on"
        run: |
          cd services
          python -m venv .venv
          source .venv/bin/activate
          pip install ".[inference]"
          pip install pyinstaller

      - name: Build services bundle
        run: bash scripts/build/build_services.sh

      # ── Build with Xcode signing the app + frameworks with Developer ID ──
      - name: Build macOS app
        run: bash scripts/build/build_macos.sh --skip-services

      # ── Sign only the services binaries (added after Xcode build) ──
      - name: Sign services binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="studiomc_app/build/macos/Build/Products/Release/Studiomc.app"
          IDENTITY="Developer ID Application: Manish Chawda ($APPLE_TEAM_ID)"
          ENTITLEMENTS="studiomc_app/macos/Runner/Release.entitlements"

          # Sign all Mach-O binaries in the services bundle
          if [ -d "$APP_PATH/Contents/Resources/studiomc_services" ]; then
            find "$APP_PATH/Contents/Resources/studiomc_services" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
              fi
            done
          fi

          # Sign llama-server binaries if present
          if [ -d "$APP_PATH/Contents/Resources/bin" ]; then
            find "$APP_PATH/Contents/Resources/bin" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
              fi
            done
          fi

          # Verify every embedded Mach-O binary in the bundled services.
          VERIFY_FAILED=0
          if [ -d "$APP_PATH/Contents/Resources/studiomc_services" ]; then
            while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                if ! codesign --verify --strict --verbose=2 "$f"; then
                  echo "::error::Unsigned or invalid binary: $f"
                  VERIFY_FAILED=1
                fi
              fi
            done < <(find "$APP_PATH/Contents/Resources/studiomc_services" -type f)
          fi
          if [ "$VERIFY_FAILED" -ne 0 ]; then
            exit 1
          fi

          # Re-sign the app bundle to cover the newly added services
          codesign --force --sign "$IDENTITY" --options runtime \
            --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          # Verify entire bundle
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✓ Code signing complete"

      - name: Create DMG
        run: |
          brew install create-dmg
          bash scripts/release/macos_dmg.sh

      - name: Sign the DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(ls dist/Studiomc-*-macOS.dmg)
          IDENTITY="Developer ID Application: Manish Chawda ($APPLE_TEAM_ID)"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG_PATH"

      - name: Notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG_PATH=$(ls dist/Studiomc-*-macOS.dmg)
          SUBMISSION=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))")
          ID=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/Studiomc-*-macOS.dmg "dist/Studiomc-${VERSION}-macOS-AppleSilicon.dmg"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.dmg

  # ── macOS Intel ────────────────────────────────────────────────────
  macos-intel:
    name: macOS (Intel)
    runs-on: macos-15  # latest macOS runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # ── Import certificate BEFORE building ──
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # ── Configure Xcode for Developer ID signing ──
      - name: Configure Xcode signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PBXPROJ="studiomc_app/macos/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/CODE_SIGN_IDENTITY = "-";/CODE_SIGN_IDENTITY = "Developer ID Application";/' "$PBXPROJ"

          sed -i '' '/CODE_SIGN_ENTITLEMENTS = Runner\/Release.entitlements/,/name = Release/ {
            s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/
          }' "$PBXPROJ"

          sed -i '' "/CODE_SIGN_ENTITLEMENTS = Runner\/Release.entitlements/,/name = Release/ {
            /COMBINE_HIDPI_IMAGES = YES/a\\
            DEVELOPMENT_TEAM = $APPLE_TEAM_ID;
          }" "$PBXPROJ"

          echo "Checking pbxproj for Developer ID..."
          grep -A2 "Developer ID" "$PBXPROJ" || echo "Warning: Developer ID not found"
          grep "DEVELOPMENT_TEAM" "$PBXPROJ" || echo "Warning: DEVELOPMENT_TEAM not found"

      - name: Install Python dependencies
        env:
          CMAKE_ARGS: "-DGGML_METAL=on -DGGML_NATIVE=off"
        run: |
          cd services
          python -m venv .venv
          source .venv/bin/activate
          pip install ".[inference]"
          pip install pyinstaller

      - name: Build services bundle
        run: bash scripts/build/build_services.sh

      - name: Build macOS app
        run: bash scripts/build/build_macos.sh --skip-services

      - name: Sign services binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="studiomc_app/build/macos/Build/Products/Release/Studiomc.app"
          IDENTITY="Developer ID Application: Manish Chawda ($APPLE_TEAM_ID)"
          ENTITLEMENTS="studiomc_app/macos/Runner/Release.entitlements"

          if [ -d "$APP_PATH/Contents/Resources/studiomc_services" ]; then
            find "$APP_PATH/Contents/Resources/studiomc_services" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
              fi
            done
          fi

          if [ -d "$APP_PATH/Contents/Resources/bin" ]; then
            find "$APP_PATH/Contents/Resources/bin" -type f | while read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign "$IDENTITY" --options runtime --timestamp "$f"
              fi
            done
          fi

          # Verify every embedded Mach-O binary in the bundled services.
          VERIFY_FAILED=0
          if [ -d "$APP_PATH/Contents/Resources/studiomc_services" ]; then
            while IFS= read -r f; do
              if file "$f" | grep -q "Mach-O"; then
                if ! codesign --verify --strict --verbose=2 "$f"; then
                  echo "::error::Unsigned or invalid binary: $f"
                  VERIFY_FAILED=1
                fi
              fi
            done < <(find "$APP_PATH/Contents/Resources/studiomc_services" -type f)
          fi
          if [ "$VERIFY_FAILED" -ne 0 ]; then
            exit 1
          fi

          codesign --force --sign "$IDENTITY" --options runtime \
            --entitlements "$ENTITLEMENTS" --timestamp "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✓ Code signing complete"

      - name: Create DMG
        run: |
          brew install create-dmg
          bash scripts/release/macos_dmg.sh

      - name: Sign the DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(ls dist/Studiomc-*-macOS.dmg)
          IDENTITY="Developer ID Application: Manish Chawda ($APPLE_TEAM_ID)"
          codesign --force --sign "$IDENTITY" --timestamp "$DMG_PATH"

      - name: Notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG_PATH=$(ls dist/Studiomc-*-macOS.dmg)
          SUBMISSION=$(xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','Unknown'))")
          ID=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))")

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            exit 1
          fi

          xcrun stapler staple "$DMG_PATH"

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/Studiomc-*-macOS.dmg "dist/Studiomc-${VERSION}-macOS-Intel.dmg"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: dist/*.dmg

  # ── Windows x64 ───────────────────────────────────────────────────
  windows-x64:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Python dependencies
        shell: bash
        run: |
          cd services
          python -m venv .venv
          source .venv/Scripts/activate
          pip install ".[inference]"
          pip install pyinstaller

      - name: Build services bundle
        shell: bash
        run: |
          cd services
          source .venv/Scripts/activate
          python -m PyInstaller studiomc_services.spec --clean --noconfirm

      - name: Build Flutter Windows app
        run: |
          cd studiomc_app
          flutter build windows --release

      - name: Embed services into release
        shell: bash
        run: |
          RELEASE_DIR="studiomc_app/build/windows/x64/runner/Release"
          cp -R services/dist/studiomc_services "$RELEASE_DIR/studiomc_services"

      - name: Create installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\release\windows_setup.iss

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          mv dist/Studiomc-*-Windows-Setup.exe "dist/Studiomc-${VERSION}-Windows-x64-Setup.exe" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*-Windows-*.exe

  # ── Linux x64 ─────────────────────────────────────────────────────
  linux-x64:
    name: Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node /usr/share/swift
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Python dependencies
        run: |
          cd services
          python -m venv .venv
          source .venv/bin/activate
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[inference]"
          pip install pyinstaller
          pip cache purge
          rm -rf /home/runner/.cache/pip

      - name: Build services bundle
        run: bash scripts/build/build_services.sh

      - name: Build Flutter Linux app
        run: |
          cd studiomc_app
          flutter build linux --release

      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Create AppImage
        run: bash scripts/release/linux_appimage.sh

      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/Studiomc-*-x86_64.AppImage "dist/Studiomc-${VERSION}-Linux-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.AppImage

  # ── Publish GitHub Release ──────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [macos-arm64, macos-intel, windows-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
