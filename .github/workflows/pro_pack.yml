# ══════════════════════════════════════════════════════════════════════════
# Studiomc — Pro pack release pipeline
#
# Builds the platform-specific Pro pack tarball (PyTorch + transformers +
# peft + accelerate + sentence-transformers, plus MLX on Apple Silicon)
# and publishes it as a GitHub Release asset alongside the desktop app.
#
# Trigger 1: a release tag (vX.Y.Z) — runs as part of the normal release.
# Trigger 2: ``workflow_dispatch`` with a custom ``pro_pack_version`` input,
#            for shipping a pack hotfix without re-cutting the desktop app.
#
# Output assets (uploaded to the matching GitHub Release):
#   studiomc-pro-<version>-macos-arm64.tar.zst (+ .sha256, .manifest.json)
#
# Apple Silicon only for now. Intel Mac and Linux desktop are out of scope.
# ══════════════════════════════════════════════════════════════════════════

name: Pro pack

on:
  push:
    tags:
      - "v*"
      - "pro-v*"
  workflow_dispatch:
    inputs:
      pro_pack_version:
        description: "Pro pack version to stamp into VERSION (e.g. 0.1.1)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      # Don't cancel the others if one platform fails — the user still
      # gets a partial Pro pack release for the platforms that worked.
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            runs-on: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install zstd
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install zstd
          else
            sudo apt-get update && sudo apt-get install -y zstd
          fi

      - name: Resolve Pro pack version
        id: vars
        run: |
          if [[ -n "${{ github.event.inputs.pro_pack_version }}" ]]; then
            VERSION="${{ github.event.inputs.pro_pack_version }}"
          else
            # Strip leading "v" or "pro-v" from the tag
            RAW="${GITHUB_REF_NAME}"
            VERSION="${RAW#v}"
            VERSION="${VERSION#pro-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Pro pack version → $VERSION"

      - name: Build Pro pack
        env:
          PRO_PACK_VERSION: ${{ steps.vars.outputs.version }}
          PRO_PACK_EXPECT_PLATFORM: ${{ matrix.platform }}
          PYTHON_BIN: python${{ env.PYTHON_VERSION }}
        run: bash scripts/build/build_pro_pack.sh

      - name: Show artifact summary
        run: |
          ls -lh dist/pro-pack/
          cat dist/pro-pack/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: pro-pack-${{ matrix.platform }}
          path: |
            dist/pro-pack/*.tar.zst
            dist/pro-pack/*.sha256
            dist/pro-pack/*.manifest.json

  publish:
    name: Publish Pro pack assets
    needs: build
    # Only publish when triggered by a tag (not workflow_dispatch). Run even
    # if one matrix leg failed: ``needs`` alone would skip this job and drop
    # the platforms that did build, defeating ``fail-fast: false`` above.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pro-pack-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh pro-pack-artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            pro-pack-artifacts/*.tar.zst
            pro-pack-artifacts/*.sha256
            pro-pack-artifacts/*.manifest.json
