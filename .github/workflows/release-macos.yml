name: Build & Release macOS

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    permissions:
      contents: write  # Needed for creating releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: studiomc_app
        run: flutter pub get

      - name: Build macOS release
        working-directory: studiomc_app
        run: flutter build macos --release

      - name: Read version
        id: version
        working-directory: studiomc_app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}' | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package DMG
        run: |
          APP_PATH="studiomc_app/build/macos/Build/Products/Release/studiomc_app.app"
          STAGING=$(mktemp -d)
          cp -R "$APP_PATH" "$STAGING/Studiomc.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "Studiomc" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "Studiomc-${{ steps.version.outputs.version }}-macos.dmg"
          rm -rf "$STAGING"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studiomc-macos-dmg
          path: "Studiomc-*.dmg"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "Studiomc-*.dmg"
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
