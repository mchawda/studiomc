[project]
name = "studiomc-services"
version = "0.1.0"
description = "Studiomc backend services — inference, model management, documents, CLaRa, LRE"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "huggingface-hub>=0.27.0",
    "PyPDF2>=3.0.0",
    "python-multipart>=0.0.18",
    "tiktoken>=0.8.0",
    "numpy>=1.26.0",
    "psutil>=6.0.0",
    "platformdirs>=4.3.0",
]

[project.optional-dependencies]
inference = [
    "torch>=2.2.0",
    "safetensors>=0.4.0",
    "transformers>=4.46.0",
    "accelerate>=1.2.0",
    "peft>=0.13.0",
    "sentencepiece>=0.2.0",
    "sentence-transformers>=3.3.0",
    "llama-cpp-python>=0.3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
include = [
    "common*",
    "supervisor*",
    "inference*",
    "model_manager*",
    "documents*",
    "clara*",
    "orchestrator*",
    "lre*",
    "training*",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
